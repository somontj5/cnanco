name: repost2
on:
  schedule:
    - cron: "17,47 * * * *"   # запасной запуск; основной делает cron-job.org
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: telegram-session   # общая очередь: все боты с одним аккаунтом Telegram идут по одному
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -U telethon requests hachoir
      - run: python repost.py
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SOURCE_CHANNELS: ${{ secrets.SOURCE_CHANNELS_2 }}
          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL_2 }}
          FOOTER: ${{ secrets.FOOTER_2 }}
          CHANNEL_TOPIC: ${{ secrets.CHANNEL_TOPIC_2 }}
          STATE_FILE: state2.json
          FIRST_RUN_HOURS: "48"
      - name: save state
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state2.json
          git diff --staged --quiet || (git commit -m "repost2 state" && (git pull --rebase && git push || (sleep 7 && git pull --rebase && git push)))
