name: clips
on:
  schedule:
    - cron: "30 6,18 * * *"   # два раза в сутки (11:30 и 23:30 по Таджикистану); за запуск обрабатывается одно видео
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: telegram-session   # общая очередь: все боты с одним аккаунтом Telegram идут по одному
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fontconfig
          for p in fonts-montserrat fonts-open-sans fonts-ubuntu; do sudo apt-get install -y $p || true; done
          fc-cache -f
      - run: pip install -U telethon requests pillow "yt-dlp[default]"
      - run: python clips.py
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANNEL_HANDLE: ${{ secrets.CHANNEL_HANDLE }}
          SHORTS_CHAT: ${{ secrets.SHORTS_CHAT }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ secrets.YT_PRIVACY }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
      - name: save state
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add clips_state.json
          git diff --staged --quiet || (git commit -m "clips state" && (git pull --rebase && git push || (sleep 7 && git pull --rebase && git push)))
